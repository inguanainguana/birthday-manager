<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Подарок')}"></head>
<body>

<div th:replace="~{base :: navbar}"></div>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row w-100 justify-content-center">
        <div class="col-md-9 col-lg-7 col-xl-6">

            <div class="card">
                <div class="card-body">
                    <h3 class="text-center mb-4"
                        th:text="${gift.id != null} ? 'Редактирование подарка' : 'Новый подарок'">
                        Новый подарок
                    </h3>

                    <form th:action="@{/gifts/save}" th:object="${gift}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Название</label>
                            <input type="text" th:field="*{title}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea th:field="*{description}" class="form-control"
                                      rows="3"
                                      placeholder="Пара слов о подарке: почему он подойдёт, где купить и т.д."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Стоимость</label>
                            <input type="number" step="0.01" min="0" th:field="*{price}"
                                   class="form-control">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Кому</label>
                            <select name="birthdayId" class="form-control" required>
                                <option value="" disabled
                                        th:selected="${gift.birthday == null}">
                                    — Выберите именинника —
                                </option>
                                <option th:each="b : ${birthdays}"
                                        th:value="${b.id}"
                                        th:selected="${gift.birthday != null and gift.birthday.id == b.id}"
                                        th:text="${b.name + ' ' + b.surname}"></option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">Сохранить</button>

                        <div class="text-center">
                            <a th:href="@{/gifts}" class="btn btn-link">Назад</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{base :: footer}"></div>
<div th:replace="~{base :: scripts}"></div>

</body>
</html>
